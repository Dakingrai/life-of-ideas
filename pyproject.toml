[project]
name = "loil"
version = "0.1.0"
description = "Back up every Claude Code session of a repo, and the metadata needed to see how the idea evolved."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[project.scripts]
loil = "loil.entry:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
